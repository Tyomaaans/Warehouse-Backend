services:
  postgres:
    image: postgres:16-alpine
    container_name: warehouse_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: warehouse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    container_name: warehouse_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  file-service:
    build: ./file-service
    container_name: warehouse_file
    ports:
      - "8001:8001"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET}
      MINIO_SIGNATURE_BUCKET: ${MINIO_SIGNATURE_BUCKET}
      MINIO_QR_BUCKET: ${MINIO_QR_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ✅ Tambahkan Go app jika ikut di-compose
  app:
    build: .
    container_name: warehouse_app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRY: ${JWT_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      REDIS_ADDR: ${REDIS_ADDR}            # ← bukan localhost, pakai service name
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio:9000         # ← bukan localhost
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET}
      MINIO_SIGNATURE_BUCKET: ${MINIO_SIGNATURE_BUCKET}
      MINIO_QR_BUCKET: ${MINIO_QR_BUCKET}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: